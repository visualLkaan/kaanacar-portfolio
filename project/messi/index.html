<!-- Project detail page: the media-heavy half of the mobile/tablet project architecture (see
     js/project-data.js's own header comment). Intentionally simple -- back link, title, and this
     one project's own media -- reusing the homepage's existing #project-page/gallery/video
     styling as a plain page instead of an overlay dialog, so it stays visually consistent with
     zero new CSS. document.title and the actual content are filled in by js/project-page.js,
     which resolves the project from this URL's own /project/<id>/ slug via PROJECTS
     (js/project-data.js) -- no per-project HTML/data lives in this file, just a static shell
     identical across every project/<id>/index.html. -->
<div id="project-page" class="project-page open" aria-hidden="false">
  <a class="project-page__close" id="project-page-back" href="../../index.html#work" aria-label="Back to projects">←</a>
  <div class="project-page__inner" id="project-page-inner"></div>
</div>

<script src="../../js/project-data.js"></script>
<script src="../../js/project-render.js"></script>
<script src="../../js/project-page.js"></script>
